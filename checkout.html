<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment – Learniverse</title>
<link rel="icon" type="image/png" href="LOOGO.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="store.css">
<link rel="stylesheet" href="checkout.css">
</head>
<body>
<header class="topbar">
  <div class="nav-pill">
    <a href="store.html" class="brand">
      <img src="LOOGO.png" alt="Learniverse logo" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'📖'}))">
      <span><strong>Learniverse</strong><small>Read • Learn • Grow</small></span>
    </a>
    <nav class="tabs" aria-label="Main Pages">
      <a href="store.html">Books</a>
      <a href="about-learniverse.html">💡 About</a>
    </nav>
  </div>
</header>

<main class="co" id="co">
  <h1>Payment</h1>
  <div class="co-grid" id="grid">
    <form class="panel" id="form" novalidate>
      <h2>Your details</h2>
      <label class="field">Full name<input name="name" required autocomplete="name"></label>
      <label class="field">Email for your books<input name="email" type="email" required autocomplete="email"></label>
      <label class="field">Mobile number<input name="mobile" inputmode="numeric" placeholder="09XXXXXXXXX" required autocomplete="tel"><small>The number registered to your e-wallet.</small></label>
      <fieldset class="pay">
        <legend>Pay with</legend>
        <label><input type="radio" name="pay" value="GCash" checked><span class="badge g">G</span>GCash</label>
        <label><input type="radio" name="pay" value="Maya"><span class="badge m">M</span>Maya</label>
      </fieldset>
      <p class="err" id="err" role="alert" hidden></p>
      <button class="btn primary" type="submit" id="payBtn">Check out and pay</button>
    </form>
    <aside class="panel" aria-label="Order summary">
      <h2>Order summary</h2>
      <div id="sum"></div>
      <div class="sum-total"><span>Total</span><span id="total">₱0</span></div>
    </aside>
  </div>
</main>

<footer class="site-footer">
  <span class="foot-book">📖</span>
  <p>
    <a href="about-learniverse.html">About Learniverse</a>
    <a href="reviews.html">Customer Reviews</a>
    <a href="terms.html">Terms &amp; Conditions</a>
    <a href="privacy.html">Privacy Policy</a>
    <a href="refund.html">Refund Policy</a>
  </p>
  <p>© 2026 Learniverse. Inspiring Curiosity, Creativity, and Lifelong Learning. ♥</p>
</footer>

<script src="config.js"></script>
<script src="books.js"></script>
<script>
const cart=loadCart();
const total=cart.reduce((s,id)=>s+BOOKS[id].price,0);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const params=new URLSearchParams(location.search);
function box(inner){$("#co").innerHTML=`<div class="panel done-box">${inner}</div>`}
function thanks(ref){
  saveCart([]);
  box(`<h2>Thank you!</h2><p>Order <b>${esc(ref)}</b> is received.</p>
  <div class="how">Your digital books will be emailed to you once your payment is confirmed.</div>
  <a class="btn primary" href="store.html">Keep browsing</a>`);
}
function manual(o){
  const w=o.method==="GCash"?CONFIG.GCASH:CONFIG.MAYA;
  box(`<h2>Send ${peso(total)} with ${o.method}</h2>
  <p>Open the <b>${o.method}</b> app, send the exact amount, and put <b>${o.ref}</b> in the message or note.</p>
  <div class="how"><img class="qr" src="${w.qr}" alt="${o.method} QR code" onerror="this.style.display='none'">
  <b>${esc(w.number)}</b><br>${esc(w.name)}</div>
  <form id="paid" class="paid"><label class="field">${o.method} reference number<input name="txn" required></label>
  <p class="err" id="err2" role="alert" hidden></p>
  <button class="btn primary" type="submit">I have paid</button></form>`);
  $("#paid").onsubmit=async e=>{
    e.preventDefault();
    const txn=new FormData(e.target).get("txn").trim();
    const order={...o,total,txn,books:o.items.map(i=>BOOKS[i].title).join(", ")};
    if(CONFIG.FORM_ENDPOINT){
      try{
        const r=await fetch(CONFIG.FORM_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify(order)});
        if(!r.ok)throw 0;
      }catch(x){$("#err2").hidden=false;$("#err2").textContent="Could not send your order. Please try again.";return}
    }else{
      const body=Object.entries(order).map(([k,v])=>k+": "+v).join("\n");
      location.href="mailto:"+CONFIG.OWNER_EMAIL+"?subject="+encodeURIComponent("Learniverse order "+o.ref)+"&body="+encodeURIComponent(body);
    }
    thanks(o.ref);
  };
}
if(params.get("paid")){thanks(params.get("ref")||"")}
else if(!cart.length){box(`<h2>Your cart is empty</h2><p>Add a book first, then come back to pay.</p><a class="btn primary" href="store.html">Browse books</a>`)}
else{
  $("#sum").innerHTML=cart.map(id=>`<div class="sum-item"><span>${BOOKS[id].title}</span><b>${peso(BOOKS[id].price)}</b></div>`).join("");
  $("#total").textContent=peso(total);
  $("#form").onsubmit=async e=>{
    e.preventDefault();
    const f=new FormData(e.target),err=$("#err"),btn=$("#payBtn");
    const name=f.get("name").trim(),email=f.get("email").trim(),mobile=f.get("mobile").replace(/[\s-]/g,"");
    let msg="";
    if(!name)msg="Enter your full name.";
    else if(!/^\S+@\S+\.\S+$/.test(email))msg="Enter a valid email address.";
    else if(!/^(09|\+639)\d{9}$/.test(mobile))msg="Enter a Philippine mobile number, like 09XXXXXXXXX.";
    err.hidden=!msg;err.textContent=msg;
    if(msg)return;
    const method=f.get("pay"),ref="LV-"+Date.now().toString(36).toUpperCase().slice(-6);
    const o={name,email,mobile,method,ref,items:cart};
    if(CONFIG.PAYMENT_API){
      btn.disabled=true;btn.textContent="Opening "+method+"…";
      try{
        const r=await fetch(CONFIG.PAYMENT_API,{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({items:cart,name,email,mobile,ref,method:method==="Maya"?"paymaya":"gcash"})});
        const j=await r.json();
        if(!j.url)throw 0;
        location.href=j.url;
      }catch(x){btn.disabled=false;btn.textContent="Check out and pay";err.hidden=false;err.textContent="Could not open "+method+". Please try again."}
    }else manual(o);
  };
}
</script>
<script src="back.js"></script>
</body>
</html>
